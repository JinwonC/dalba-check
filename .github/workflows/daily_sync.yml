name: Daily TikTok Sync

on:
  workflow_dispatch:      # cron-job.org에서 트리거
    inputs:
      report_date:
        description: '리포트 날짜 (YYYY-MM-DD). 비워두면 LA 기준 어제 날짜 자동 사용'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # 파이썬 스크립트는 이 브랜치에만 있으므로 항상 여기서 체크아웃
          ref: claude/bypass-sheets-timeout-8nw21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Write secret files
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json
          echo '${{ secrets.TOKENS_JSON }}' > tokens.json
          echo '${{ secrets.ADS_TOKENS_JSON }}' > ads_tokens.json

      - name: Compute report date (LA time)
        id: date
        run: |
          # report_date 입력이 있으면 그 날짜, 없으면 LA 기준 어제 날짜
          if [ -n "${{ github.event.inputs.report_date }}" ]; then
            YESTERDAY="${{ github.event.inputs.report_date }}"
          else
            YESTERDAY=$(TZ='America/Los_Angeles' date -d 'yesterday' '+%Y-%m-%d')
          fi
          echo "yesterday=$YESTERDAY" >> $GITHUB_OUTPUT

      - name: Run tiktok_to_sheets.py (최근 60일 업서트)
        run: |
          for i in 1 2 3; do
            python tiktok_to_sheets.py && exit 0
            echo "::warning::tiktok_to_sheets.py 실패 (${i}/3회차), 30초 후 재시도..."
            sleep 30
          done
          echo "::error::tiktok_to_sheets.py 3회 모두 실패"
          exit 1

      # 앞 스텝이 실패해도 광고/SKU 데이터는 반드시 적재되도록 !cancelled() 로 독립 실행
      - name: Run SKU별_성과.py (어제 날짜)
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          for i in 1 2 3; do
            python TEST/SKU별_성과.py ${{ steps.date.outputs.yesterday }} && exit 0
            echo "::warning::SKU별_성과.py 실패 (${i}/3회차), 30초 후 재시도..."
            sleep 30
          done
          echo "::error::SKU별_성과.py 3회 모두 실패"
          exit 1

      - name: Run tiktok_ads.py (어제 날짜)
        if: ${{ !cancelled() }}
        run: |
          for i in 1 2 3; do
            python tiktok_ads.py "${{ steps.date.outputs.yesterday }} ~ ${{ steps.date.outputs.yesterday }}" && exit 0
            echo "::warning::tiktok_ads.py 실패 (${i}/3회차), 30초 후 재시도..."
            sleep 30
          done
          echo "::error::tiktok_ads.py 3회 모두 실패"
          exit 1

      - name: Run tiktok_spark_ads.py (스파크애즈, 어제 날짜)
        if: ${{ !cancelled() }}
        run: |
          for i in 1 2 3; do
            python tiktok_spark_ads.py "${{ steps.date.outputs.yesterday }} ~ ${{ steps.date.outputs.yesterday }}" && exit 0
            echo "::warning::tiktok_spark_ads.py 실패 (${i}/3회차), 30초 후 재시도..."
            sleep 30
          done
          echo "::error::tiktok_spark_ads.py 3회 모두 실패"
          exit 1

      # 영상성과_신API테스트 탭 UPSERT
      #  - 평일: 최근 90일만 갱신 (약 5~10분)
      #  - 토요일(KST): full — 2026-01-01 ~ 오늘 전체 재조회로 정합성 보정
      - name: Run video_perf_upsert.py (매일 90일 / 토요일 full)
        if: ${{ !cancelled() }}
        run: |
          DOW=$(TZ='Asia/Seoul' date '+%u')   # 1=월 ... 6=토, 7=일
          if [ "$DOW" = "6" ]; then W="full"; else W="90"; fi
          echo "::notice::video_perf_upsert window=$W (KST DOW=$DOW)"
          for i in 1 2 3; do
            python video_perf_upsert.py "$W" && exit 0
            echo "::warning::video_perf_upsert.py 실패 (${i}/3회차), 30초 후 재시도..."
            sleep 30
          done
          echo "::error::video_perf_upsert.py 3회 모두 실패"
          exit 1

      # PAID 성과 트래킹 (GMV) 탭 M~T 채움 — 광고소재성과(위 tiktok_ads가 갱신)를 영상ID로 집계
      - name: Run paid_tracking.py (PAID 트래킹 M~T)
        if: ${{ !cancelled() }}
        run: |
          for i in 1 2 3; do
            python paid_tracking.py write && exit 0
            echo "::warning::paid_tracking.py 실패 (${i}/3회차), 30초 후 재시도..."
            sleep 30
          done
          echo "::error::paid_tracking.py 3회 모두 실패"
          exit 1
