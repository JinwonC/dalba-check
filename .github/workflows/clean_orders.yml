name: Clean Orders
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/bypass-sheets-timeout-8nw21 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests gspread google-auth
      - run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json
          echo '${{ secrets.TOKENS_JSON }}' > tokens.json
      - run: python clean_orders.py
