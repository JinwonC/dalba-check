name: Video Grade

on:
  workflow_dispatch:
    inputs:
      spreadsheet_id:
        description: '평가할 시트 ID (첫 탭)'
        required: false
        default: '17UnCxe42zE9ey-i0P2FWHfBIExsdehtDbtA9hIh-D_k'
      post_date:
        description: '이 포스팅일(YYYY-MM-DD)만 평가. 비우면 전체'
        required: false
        default: ''
      limit:
        description: '최대 평가 개수 (0 = 전부)'
        required: false
        default: '5'

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # 파이썬 스크립트는 이 브랜치에만 있으므로 항상 여기서 체크아웃
          ref: claude/bypass-sheets-timeout-8nw21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth anthropic pydantic requests

      - name: Write secret files
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Run grade_sheet.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRUVA_API_KEY: ${{ secrets.CRUVA_API_KEY }}
        run: |
          ARGS="--sheet-id ${{ github.event.inputs.spreadsheet_id }} --limit ${{ github.event.inputs.limit }}"
          if [ -n "${{ github.event.inputs.post_date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.post_date }}"; fi
          python video_grading/grade_sheet.py $ARGS
