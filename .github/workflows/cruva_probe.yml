name: Cruva Probe (임시)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Cruva AI 분석 커버리지 (포스팅일별)
        env:
          CRUVA_API_KEY: ${{ secrets.CRUVA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from collections import defaultdict
          from datetime import date, timedelta
          key = os.environ["CRUVA_API_KEY"]
          def page(d_from, d_to, n):
              body = json.dumps({"filters": {"date_range": {"from": d_from, "to": d_to}}, "page_size": 100, "page_number": n}).encode()
              req = urllib.request.Request("https://api.cruva.com/affiliate/videos/list", data=body, method="POST",
                  headers={"Content-Type": "application/json", "x-api-key": key, "x-shop-id": "69b9712fd9c02f34547155d5"})
              return json.load(urllib.request.urlopen(req, timeout=60)).get("data") or {}
          start = date(2026, 9, 24)
          stats = defaultdict(lambda: defaultdict(int))
          n = 1
          while True:
              d = page(start.isoformat(), "2026-10-25", n)
              res = d.get("results") or []
              for v in res:
                  day = str(v.get("post_time") or "")[:10]
                  s = stats[day]
                  s["total"] += 1
                  ok = bool(v.get("transcript") or v.get("on_screen_text") or v.get("content_overview"))
                  s["analyzed"] += ok
                  if not ok:
                      s["attempted_no_result" if (v.get("ai_attempts") or 0) > 0 else "not_attempted"] += 1
                      if v.get("unavailable_at"): s["unavailable"] += 1
              if not res or not d.get("has_more"): break
              n += 1; time.sleep(0.15)
          for day in sorted(stats):
              s = stats[day]
              print(f"::notice::{day}: 전체 {s['total']} / 분석됨 {s['analyzed']} ({100*s['analyzed']//max(s['total'],1)}%) / 시도했으나 결과없음 {s['attempted_no_result']} / 미시도 {s['not_attempted']} / 비공개·삭제 {s['unavailable']}")
          PY
